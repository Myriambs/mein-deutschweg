<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mein Deutschweg</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#3446d4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deutschweg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one guided reading column. Home = next step + 8-level path; unit = 9 step tabs; quiz = one question at a time; notes = handwritten paper sheet. */
:root {
  --bg: #f5f6f9; --surface: #ffffff; --sunk: #eceef4; --fg: #161b2e; --muted: #5a6178; --line: #d9dce6;
  --accent: #3446d4; --accent-soft: #e4e7fb; --on-accent: #ffffff;
  --der: #2563c9; --die: #c8344a; --das: #1b8657; --pl: #8a6d12;
  --good: #1b8657; --good-soft: #e1f3ea; --bad: #c8344a; --bad-soft: #fbe6ea; --part: #9a6a00; --part-soft: #fdf1d6;
  --paper: #fffdf6; --rule: #d6e4f5; --margin: #f2a4ad; --ink: #1d3a8a; --pencil: #39363a; --hl: #fff27a; --sticky: #fff1a8; --sticky-ink: #4a3b00;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --hand: "Kalam", "Comic Sans MS", "Segoe Print", cursive;
  --script: "Caveat", "Kalam", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131c; --surface: #1a1d29; --sunk: #232737; --fg: #e9ebf3; --muted: #9da3b8; --line: #2e3346;
    --accent: #8d9bff; --accent-soft: #262c52; --on-accent: #11131c;
    --der: #6fa3ff; --die: #ff7d8f; --das: #4fd193; --pl: #d6c27a;
    --good: #4fd193; --good-soft: #17352a; --bad: #ff7d8f; --bad-soft: #3d1d24; --part: #f2c25c; --part-soft: #3a2f14;
    --paper: #20232f; --rule: #2d3448; --margin: #7a3a44; --ink: #a9c1ff; --pencil: #d9d6dc; --hl: #6b5f12; --sticky: #3d3714; --sticky-ink: #f6e7a6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11131c; --surface: #1a1d29; --sunk: #232737; --fg: #e9ebf3; --muted: #9da3b8; --line: #2e3346;
  --accent: #8d9bff; --accent-soft: #262c52; --on-accent: #11131c;
  --der: #6fa3ff; --die: #ff7d8f; --das: #4fd193; --pl: #d6c27a;
  --good: #4fd193; --good-soft: #17352a; --bad: #ff7d8f; --bad-soft: #3d1d24; --part: #f2c25c; --part-soft: #3a2f14;
  --paper: #20232f; --rule: #2d3448; --margin: #7a3a44; --ink: #a9c1ff; --pencil: #d9d6dc; --hl: #6b5f12; --sticky: #3d3714; --sticky-ink: #f6e7a6; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.15; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: grid; gap: 20px; padding-block: 22px 72px; }
.stack > * { min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.spread { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
header.top .wrap { padding-block: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo { font: 800 1.35rem var(--display); letter-spacing: -0.02em; background: none; border: 0; cursor: pointer; padding: 0; }
.logo span { color: var(--accent); }
.hstats { display: flex; gap: 6px; align-items: center; }
.pill { white-space: nowrap; font: 700 0.85rem var(--body); background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
.btnlike { cursor: pointer; color: var(--fg); }
.pill.icon { display: inline-grid; place-items: center; padding: 4px 7px; }

.eyebrow { font: 700 0.75rem var(--body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.title { display: grid; gap: 6px; }
.title h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 800; letter-spacing: -0.015em; }
.lede { color: var(--muted); max-width: 64ch; }
.sub { color: var(--muted); font-size: 0.95rem; }
.warn { background: var(--part-soft); color: var(--fg); border-left: 4px solid var(--part); padding: 10px 14px; border-radius: 8px; }

.btn { font: 700 1rem var(--body); border: 2px solid var(--accent); background: var(--accent); color: var(--on-accent); padding: 11px 18px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.big { font-size: 1.08rem; padding: 13px 22px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.btn[disabled] { background: var(--sunk); border-color: var(--line); color: var(--muted); cursor: not-allowed; filter: none; }
.back, .linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 4px 0; justify-self: start; }
.linkbtn { text-decoration: underline; }
.say { background: var(--accent-soft); border: 0; border-radius: 8px; cursor: pointer; padding: 4px 8px; font-size: 0.95rem; flex: none; }
.say.slow { background: var(--sunk); }
.say.ink { background: transparent; padding: 0 4px; }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.g-der { color: var(--der); } .g-die { color: var(--die); } .g-das { color: var(--das); } .g-pl { color: var(--pl); }

.center-col { min-height: 70vh; display: grid; place-items: center; }
.hello { display: grid; gap: 14px; text-align: center; justify-items: center; }
.hello h1 { font-size: 3rem; }
.next { background: var(--surface); border: 2px solid var(--accent); border-radius: 16px; padding: 20px; display: grid; gap: 10px; }
.next h2 { font-size: 1.45rem; }
.todo { background: var(--accent-soft); border-radius: 12px; padding: 12px 16px; display: grid; gap: 2px; }
.todo b { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.planrow { display: flex; gap: 14px; justify-content: space-between; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.planrow > div:first-child { display: grid; gap: 6px; flex: 1 1 260px; min-width: 0; }
.planrow span { color: var(--muted); font-size: 0.93rem; }

.path { display: grid; gap: 10px; }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; }
@media (max-width: 600px) { .lcard { grid-template-columns: auto minmax(0, 1fr); } .lcard .act { grid-column: 1 / -1; } .lcard .act .btn { width: 100%; } }
.lcard .badge { width: 66px; height: 66px; border-radius: 14px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 800 1.25rem var(--display); }
.lcard.locked .badge { background: var(--sunk); color: var(--muted); }
.lcard.passed .badge { background: var(--good); }
.lc-body { display: grid; gap: 6px; }
.lcard h3 { font-size: 1.12rem; }
.meta { font-size: 0.86rem; color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; }
.lockt { color: var(--muted); font-weight: 700; }

.ulist { display: grid; gap: 8px; }
.ucard { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; }
.ucard[disabled] { cursor: not-allowed; opacity: 0.6; }
.ucard .un { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font: 800 1.1rem var(--display); }
.ucard.open .un { background: var(--accent); color: var(--on-accent); }
.ucard.done .un { background: var(--good); color: var(--on-accent); }
.ucard.review .un { background: var(--part); color: var(--on-accent); }
.ucard .ut { display: grid; } .ucard small { color: var(--muted); }
.ucard .us { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.examcard { background: var(--surface); border: 2px dashed var(--accent); border-radius: 16px; padding: 18px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.examcard > div { display: grid; gap: 8px; flex: 1 1 300px; min-width: 0; }
.examcard.passed { border-style: solid; border-color: var(--good); }
.parts { display: flex; gap: 6px; flex-wrap: wrap; }
.pt { font-size: 0.82rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--sunk); }
.pt.ok { background: var(--good-soft); color: var(--good); } .pt.bad { background: var(--bad-soft); color: var(--bad); }

/* step tabs */
.steps { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
@media (max-width: 700px) { .steps { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.stp { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; cursor: pointer; display: grid; justify-items: center; gap: 2px; font-size: 0.74rem; color: var(--muted); }
.stp i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-weight: 800; color: var(--fg); }
.stp span { overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
.stp.done i { background: var(--good); color: var(--on-accent); }
.stp.on { border-color: var(--accent); color: var(--fg); box-shadow: inset 0 -3px 0 var(--accent); }

/* handwritten notes */
.sheet { position: relative; background-color: var(--paper); background-image: linear-gradient(var(--rule) 1px, transparent 1px); background-size: 100% 2.1rem; background-position: 0 1.6rem;
  font: 400 1.18rem/2.1rem var(--hand); color: var(--pencil); padding: 1.6rem 1.2rem 1.4rem 3.2rem; border-radius: 6px; box-shadow: 0 1px 0 var(--line), 0 10px 26px -18px rgba(20, 24, 50, .55); overflow: hidden; }
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 2.2rem; border-left: 2px solid var(--margin); }
.sheet::after { content: ""; position: absolute; top: 14px; left: 10px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); box-shadow: 0 14rem 0 var(--bg), 0 28rem 0 var(--bg); }
.sheet-top { display: flex; justify-content: space-between; font: 700 1.05rem var(--script); color: var(--muted); gap: 10px; flex-wrap: wrap; }
.sheet .sh { font: 700 1.9rem/2.1rem var(--script); color: var(--ink); margin-top: 2.1rem; transform: rotate(-0.6deg); transform-origin: left; }
.sheet .sh:first-of-type { margin-top: 0.4rem; }
.sheet .sh::after { content: ""; display: block; width: 4.5em; border-bottom: 3px solid var(--margin); border-radius: 50%; margin-top: -0.4rem; opacity: .7; }
.sheet .sp, .sheet .sb { max-width: 66ch; }
.sheet .sx { color: var(--ink); }
.sheet .sx .de { font-weight: 700; }
.sheet .sx .tr { color: var(--muted); }
.sheet mark { background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 2px; }
.sheet .pen { text-decoration: underline wavy var(--margin); text-underline-offset: 4px; }
.sheet b { color: var(--ink); }
.sheet .tscroll { overflow-x: auto; margin-block: 0.4rem; }
.htable { border-collapse: separate; border-spacing: 0; font: 400 1.12rem/1.9rem var(--hand); background: var(--paper); border: 2px solid var(--pencil); border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; }
.htable td, .htable th { padding: 2px 12px; border-bottom: 1.5px dashed var(--rule); text-align: left; vertical-align: top; min-width: 5.5em; }
@media (min-width: 700px) { .htable td, .htable th { white-space: nowrap; } }
.htable th { font: 700 1.3rem var(--script); color: var(--ink); border-bottom: 2px solid var(--pencil); }
.htable tr:last-child td { border-bottom: 0; }
.sticky { background: var(--sticky); color: var(--sticky-ink); font: 400 1.1rem/1.75rem var(--hand); padding: 10px 14px; margin: 0.8rem 0; transform: rotate(-0.8deg); box-shadow: 0 6px 12px -8px rgba(0, 0, 0, .5); max-width: 62ch; }
.sticky b { color: var(--sticky-ink); }
.sign { text-align: right; font: 700 1.5rem var(--script); color: var(--ink); margin-top: 0.6rem; }
.minisheet summary { cursor: pointer; font-weight: 700; color: var(--accent); padding: 4px 0; }

.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.wcard, .prow { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.wcard > div, .prow > div { display: grid; min-width: 0; }
.wcard small, .prow small { color: var(--muted); }
.plist { display: grid; gap: 8px; }
.reading { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.reading.mini { padding: 12px 14px; max-height: 280px; overflow: auto; }
.de-text { font-size: 1.08rem; line-height: 1.75; white-space: pre-line; }
.sent { cursor: pointer; border-radius: 4px; } .sent:hover { background: var(--accent-soft); }
.trans { color: var(--muted); margin-top: 8px; white-space: pre-line; }
details summary { cursor: pointer; color: var(--accent); font-weight: 700; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; }
.task h3 { font-size: 1.1rem; }
code { background: var(--sunk); border-radius: 6px; padding: 1px 6px; font-size: 0.9em; }
.dialog { display: grid; gap: 8px; }
.dl { display: flex; gap: 10px; align-items: flex-start; max-width: 88%; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.dl.b { justify-self: end; background: var(--accent-soft); border-color: transparent; }
.dl.live { outline: 3px solid var(--accent); }
.dl .who { font-weight: 800; color: var(--accent); flex: none; }
.dl > div { display: grid; min-width: 0; } .dl b { cursor: pointer; } .dl small { color: var(--muted); }

/* quiz */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; }
.qkind { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); }
.qprompt { font: 700 1.3rem var(--display); }
.qde, .qtarget { font: 700 1.4rem var(--display); }
.qgap { font-size: 1.3rem; font-weight: 700; } .gapline { color: var(--accent); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; font-size: 1.02rem; }
.opt.de { font-weight: 700; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrongp { border-color: var(--bad); background: var(--bad-soft); }
.typebox { display: grid; gap: 8px; }
.ans { width: 100%; font: 400 1.15rem var(--body); padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); resize: vertical; }
.ans:focus { border-color: var(--accent); outline: none; }
.umlauts { display: flex; gap: 6px; flex-wrap: wrap; }
.umlauts button { min-width: 40px; padding: 6px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; font-weight: 700; }
.wc { color: var(--muted); font-variant-numeric: tabular-nums; }
.built { min-height: 58px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.built .ph { color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: 1.02rem; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); }
.chip[disabled]:not(.on) { opacity: 0.3; cursor: default; }
.ctx { display: flex; gap: 10px; align-items: center; background: var(--sunk); border-radius: 12px; padding: 10px 12px; }
.ctx span { display: grid; } .ctx small { color: var(--muted); }
.mic-area { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.mic { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); font-size: 1.9rem; cursor: pointer; }
.mic.live { background: var(--bad); animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 12px var(--bad-soft); } }
@media (prefers-reduced-motion: reduce) { .mic.live { animation: none; } .bar i { transition: none; } }
.heard { font-style: italic; color: var(--muted); }
.hitline { font-size: 1.2rem; font-weight: 700; } .h-ok { color: var(--good); } .h-no { color: var(--bad); text-decoration: underline wavy; }
.fb { border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; border: 2px solid; }
.fb.good { background: var(--good-soft); border-color: var(--good); }
.fb.bad { background: var(--bad-soft); border-color: var(--bad); }
.fb.part { background: var(--part-soft); border-color: var(--part); }
.fb.neutral { background: var(--sunk); border-color: var(--line); }
.checks, .errs { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 4px; }
.checks li::before { content: "• "; } .checks li.ok::before { content: "✓ "; color: var(--good); } .checks li.no::before { content: "✗ "; color: var(--bad); }
.errs s { color: var(--bad); } .errs small { display: block; color: var(--muted); }
.review { display: grid; gap: 8px; }
.review h3 { font-size: 1.1rem; }
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; gap: 2px; }
.rv .rq { font-weight: 700; } .rv .ry { color: var(--muted); } .rv s { color: var(--bad); }
.partlist { display: grid; gap: 8px; }
.prt { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; flex-wrap: wrap; }
.prt > div { display: grid; } .prt small { color: var(--muted); }
.prt.ok { border-color: var(--good); } .prt.bad { border-color: var(--bad); }
.okmark { color: var(--good); font-weight: 800; }
.routine, .set { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.routine ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 4px; }
.weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.wk { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.wk span { font-size: 0.8rem; color: var(--muted); } .wk b { font: 800 1.3rem var(--display); } .wk small { color: var(--muted); }
.wk.ok { border-color: var(--good); }
select, input[type=range] { width: 100%; max-width: 480px; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.lbl { font-weight: 700; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.tcard h3 { font-size: 1.05rem; } .tcard p { color: var(--muted); font-size: 0.93rem; } .tcard a { color: var(--fg); }
.chip[data-act="say"] { font-size: 0.95rem; padding: 6px 10px; }
.letter { background: var(--sunk); border-radius: 10px; padding: 14px; }
