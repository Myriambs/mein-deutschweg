<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mein Deutschweg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one guided reading column. Home = path of 4 levels; level = lesson list + exam; lesson = 5 numbered steps with Back/Next. */
:root {
  --bg: #f5f6f9; --surface: #ffffff; --sunk: #eceef4; --fg: #161b2e; --muted: #5a6178; --line: #d9dce6;
  --accent: #3446d4; --accent-soft: #e4e7fb; --on-accent: #ffffff;
  --der: #2563c9; --die: #c8344a; --das: #1b8657; --pl: #7a6a2f;
  --good: #1b8657; --good-soft: #e1f3ea; --bad: #c8344a; --bad-soft: #fbe6ea;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131c; --surface: #1a1d29; --sunk: #232737; --fg: #e9ebf3; --muted: #9da3b8; --line: #2e3346;
    --accent: #8d9bff; --accent-soft: #262c52; --on-accent: #11131c;
    --der: #6fa3ff; --die: #ff7d8f; --das: #4fd193; --pl: #d6c27a;
    --good: #4fd193; --good-soft: #17352a; --bad: #ff7d8f; --bad-soft: #3d1d24; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11131c; --surface: #1a1d29; --sunk: #232737; --fg: #e9ebf3; --muted: #9da3b8; --line: #2e3346;
  --accent: #8d9bff; --accent-soft: #262c52; --on-accent: #11131c;
  --der: #6fa3ff; --die: #ff7d8f; --das: #4fd193; --pl: #d6c27a;
  --good: #4fd193; --good-soft: #17352a; --bad: #ff7d8f; --bad-soft: #3d1d24; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55; }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; line-height: 1.15; margin: 0; }
p { margin: 0; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font: 800 1.5rem var(--display); letter-spacing: -0.02em; background: none; border: 0; color: var(--fg); cursor: pointer; padding: 0; }
.logo span { color: var(--accent); }
.save-note { font-size: 0.8rem; color: var(--muted); }
main .wrap { padding-block: 24px 64px; display: grid; gap: 22px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.eyebrow { font: 600 0.75rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.title { display: grid; gap: 6px; }
.title h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 800; letter-spacing: -0.015em; }
.title h2 { font-size: clamp(1.5rem, 5vw, 2.1rem); font-weight: 800; }
.lede { color: var(--muted); max-width: 62ch; }

.btn { font: 700 1rem var(--body); border: 2px solid var(--accent); background: var(--accent); color: var(--on-accent); padding: 12px 20px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.big { font-size: 1.1rem; padding: 14px 24px; }
.btn[disabled] { background: var(--sunk); border-color: var(--line); color: var(--muted); cursor: not-allowed; filter: none; }
.btn svg { width: 18px; height: 18px; }
.back { background: none; border: 0; color: var(--accent); font: 700 0.95rem var(--body); cursor: pointer; padding: 4px 0; justify-self: start; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }

.todo { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.todo b:first-child { font: 700 0.78rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }

.next { background: var(--surface); border: 2px solid var(--accent); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
.next h2 { font-size: 1.4rem; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 600px) { .how { grid-template-columns: 1fr; } }
.how div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; }
.how .n { grid-row: span 2; font: 800 1.6rem var(--display); color: var(--accent); line-height: 1; }
.how h3 { font-size: 1rem; }
.how p { font-size: 0.9rem; color: var(--muted); }
.path { display: grid; gap: 10px; }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
@media (max-width: 600px) { .lcard { grid-template-columns: auto 1fr; } .lcard .act { grid-column: 1 / -1; } .lcard .act .btn { width: 100%; } }
.lcard .badge { width: 64px; height: 64px; border-radius: 14px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 800 1.5rem var(--display); }
.lcard.locked .badge { background: var(--sunk); color: var(--muted); }
.lcard.passed .badge { background: var(--good); }
.lcard h3 { font-size: 1.15rem; }
.lcard .meta { font-size: 0.88rem; color: var(--muted); display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; }
.pill { font: 700 0.72rem var(--mono); text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 99px; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.lock { background: var(--sunk); color: var(--muted); }
.pill.open { background: var(--accent-soft); color: var(--accent); }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 600px) { .tools { grid-template-columns: 1fr; } }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: left; cursor: pointer; display: grid; gap: 4px; font: inherit; color: var(--fg); }
.tool:hover { border-color: var(--accent); }
.tool h3 { font-size: 1rem; }
.tool p { font-size: 0.88rem; color: var(--muted); }

.lessons { display: grid; gap: 8px; }
.lrow { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
.lrow .num { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font: 800 1rem var(--display); color: var(--muted); }
.lrow.done .num { background: var(--good); border-color: var(--good); color: var(--on-accent); }
.lrow h3 { font-size: 1.02rem; }
.lrow p { font-size: 0.86rem; color: var(--muted); }
.lrow .btn { padding: 9px 16px; }
@media (max-width: 520px) { .lrow { grid-template-columns: 40px 1fr; } .lrow .btn { grid-column: 1 / -1; width: 100%; } }
.examcard { background: var(--surface); border: 2px dashed var(--accent); border-radius: 14px; padding: 18px; display: grid; gap: 10px; }
.examcard h3 { font-size: 1.25rem; }
.can { font-size: 0.95rem; }
.can summary { cursor: pointer; color: var(--accent); font-weight: 700; }
.can ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 3px; color: var(--muted); }

.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.step { border: 0; background: none; padding: 0; cursor: pointer; display: grid; gap: 5px; text-align: left; color: var(--muted); font: 600 0.78rem var(--body); min-width: 0; }
.step i { display: block; height: 6px; border-radius: 99px; background: var(--line); }
.step.on { color: var(--accent); } .step.on i { background: var(--accent); }
.step.past i { background: var(--accent); opacity: 0.45; }
.step span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navbar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-block: 16px 0; }

.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 0.92rem; color: var(--muted); cursor: pointer; }
.toggle input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.words { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .words { grid-template-columns: 1fr; } }
.word { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.word .w { font-weight: 700; font-size: 1.05rem; }
.word .pl { font-size: 0.82rem; color: var(--muted); }
.word .en { font-size: 0.9rem; color: var(--muted); }
.hide-en .word .en { visibility: hidden; }
.hide-en .word:hover .en, .hide-en .word:focus-within .en { visibility: visible; }
.art-der { color: var(--der); } .art-die { color: var(--die); } .art-das { color: var(--das); } .art-pl { color: var(--pl); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
.legend b { font-family: var(--mono); }
.say { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--sunk); color: var(--accent); cursor: pointer; display: inline-grid; place-items: center; }
.say:hover { border-color: var(--accent); background: var(--accent-soft); }
.say svg { width: 18px; height: 18px; }
.say.playing { background: var(--accent); color: var(--on-accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.rule { display: grid; gap: 6px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.rule:last-child { border-bottom: 0; padding-bottom: 0; }
.rule h3 { font-size: 1.05rem; }
.ex { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.sent { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.sent:last-child { border-bottom: 0; }
.sent .de { font-weight: 700; }
.sent .en { font-size: 0.88rem; color: var(--muted); }
textarea, input[type="text"] { width: 100%; font: 1rem/1.5 var(--body); padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
textarea { min-height: 160px; resize: vertical; }
input[type="text"]:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

.qlist { display: grid; gap: 12px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.q .qn { font: 600 0.75rem var(--mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.q .prompt { font-weight: 700; font-size: 1.05rem; }
.q.right { border-color: var(--good); background: var(--good-soft); }
.q.wrong { border-color: var(--bad); background: var(--bad-soft); }
.fb { font-size: 0.92rem; font-weight: 700; }
.q.right .fb { color: var(--good); } .q.wrong .fb { color: var(--bad); }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; font: 1rem var(--body); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt.sel { border: 2px solid var(--accent); background: var(--accent-soft); font-weight: 700; }
.opts.inline { display: flex; flex-wrap: wrap; }
.keys { display: flex; gap: 6px; flex-wrap: wrap; }
.key { font: 700 1rem var(--body); width: 40px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); color: var(--fg); cursor: pointer; }
.key:hover { border-color: var(--accent); }
.listen { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { font-size: 0.9rem; color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--accent); font: 700 0.9rem var(--body); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.answer-line { min-height: 48px; border: 2px dashed var(--line); border-radius: 10px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.answer-line:empty::before { content: "Tap the words below in the right order"; color: var(--muted); font-size: 0.9rem; padding: 4px 6px; }
.toks { display: flex; flex-wrap: wrap; gap: 6px; }
.tok { font: 700 1rem var(--body); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); color: var(--fg); cursor: pointer; }
.tok:hover { border-color: var(--accent); }
.tok.used { visibility: hidden; }
.answer-line .tok { background: var(--accent-soft); border-color: var(--accent); }
.readtext { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; white-space: pre-wrap; font-size: 1.02rem; line-height: 1.65; }

.score { display: grid; gap: 14px; background: var(--surface); border-radius: 16px; padding: 22px; border: 2px solid var(--line); }
.score.pass { border-color: var(--good); }
.score.fail { border-color: var(--bad); }
.score .big { font: 800 clamp(2.6rem, 10vw, 4rem) var(--display); line-height: 1; font-variant-numeric: tabular-nums; }
.score.pass .big { color: var(--good); } .score.fail .big { color: var(--bad); }
.secscore { display: grid; gap: 6px; }
.secscore div { display: grid; grid-template-columns: 1fr auto; gap: 10px; font-variant-numeric: tabular-nums; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .parts { grid-template-columns: 1fr; } }
.parts div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 2px; }
.parts b { font-family: var(--display); }
.parts span { font-size: 0.88rem; color: var(--muted); }

.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .grid3 { grid-template-columns: 1fr; } }
.sound h3 { font-size: 1.5rem; }
.ipa { font-family: var(--mono); color: var(--muted); font-size: 0.88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 700 0.95rem var(--body); border: 1px solid var(--line); background: var(--sunk); color: var(--fg); border-radius: 8px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip svg { width: 13px; height: 13px; color: var(--accent); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 0.75rem var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--sunk); }
tr:last-child td { border-bottom: 0; }
.letter { background: var(--sunk); border-radius: 10px; padding: 16px; white-space: pre-wrap; font-size: 0.95rem; overflow-wrap: anywhere; }
details.model { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details.model summary { cursor: pointer; padding: 14px 16px; font: 700 1.05rem var(--display); }
details.model .mb { padding: 0 16px 16px; display: grid; gap: 12px; }
ul.clean, ol.clean { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.res h3 a { color: var(--fg); text-decoration-color: var(--accent); text-underline-offset: 3px; }
.res .lv { font: 600 0.75rem var(--mono); color: var(--accent); }
.res p { font-size: 0.92rem; color: var(--muted); }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }
footer .wrap { padding-block: 18px 32px; display: grid; gap: 4px; }
.warn { color: var(--bad); }

/* Duo-style: stats, lesson path, one-question quiz with check bar */
.stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stat { font: 800 0.9rem var(--display); padding: 4px 10px; border-radius: 99px; background: var(--sunk); font-variant-numeric: tabular-nums; }
.stat.fire { color: #d9730d; } .stat.xp { color: var(--accent); }
.trail { display: grid; gap: 18px; justify-items: center; padding-block: 8px; }
.node { display: grid; justify-items: center; gap: 6px; max-width: 220px; text-align: center; }
.node:nth-child(4n+2) { transform: translateX(-60px); } .node:nth-child(4n+4) { transform: translateX(60px); }
@media (max-width: 420px) { .node:nth-child(4n+2) { transform: translateX(-36px); } .node:nth-child(4n+4) { transform: translateX(36px); } }
.dot { width: 76px; height: 76px; border-radius: 50%; border: 0; display: grid; place-items: center; font: 800 1.6rem var(--display); cursor: pointer; background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.dot:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.dot svg { width: 30px; height: 30px; }
.node.done .dot { background: var(--good); box-shadow: 0 6px 0 color-mix(in srgb, var(--good) 60%, #000); }
.node.lock .dot { background: var(--sunk); color: var(--muted); box-shadow: 0 6px 0 var(--line); cursor: not-allowed; }
.node.cur .dot { width: 92px; height: 92px; outline: 5px solid var(--accent-soft); outline-offset: 4px; }
.node .lbl { font-weight: 700; font-size: 0.95rem; line-height: 1.25; }
.node .sub { font-size: 0.8rem; color: var(--muted); }
.node.lock .lbl { color: var(--muted); }
.bubble { font: 800 0.8rem var(--mono); letter-spacing: 0.08em; background: var(--surface); color: var(--accent); border: 2px solid var(--accent); border-radius: 10px; padding: 3px 10px; }
.qtop { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.qbar { height: 14px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .3s; }
.one .q { border: 0; background: none; padding: 0; }
.one .q .prompt { font-size: 1.3rem; }
.one .q .fb { display: none; }
.checkbar { border-radius: 14px; padding: 16px; display: grid; gap: 10px; background: var(--sunk); }
.checkbar.right { background: var(--good-soft); color: var(--good); }
.checkbar.wrong { background: var(--bad-soft); color: var(--bad); }
.checkbar h3 { font-size: 1.25rem; }
.checkbar .btn { width: 100%; }
.checkbar.right .btn { background: var(--good); border-color: var(--good); }
.checkbar.wrong .btn { background: var(--bad); border-color: var(--bad); }
.partok { color: var(--good); font-weight: 700; } .partbad { color: var(--bad); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button class="logo" type="button" data-go="home">Mein <span>Deutsch</span>weg</button>
    <div class="stats"><span class="stat fire" id="streak" title="Days in a row">🔥 0</span><span class="stat xp" id="xp" title="Experience points">0 XP</span><span class="save-note" id="saveNote">Progress saved in this browser</span></div>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<footer><div class="wrap">
  <p id="voiceStatus">Audio uses your device's built-in German voice.</p>
  <p>Hour estimates follow typical Goethe-Institut guidance. The level exams here are practice tests, not official certificates.</p>
</div></footer>

<script>
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const PASS_MARK = 80;
const ORDER = ["a1", "a2", "b1", "b2"];

let qSeq = 0;
function mcQ(prompt, opts) { const order = shuffle(opts.map((_, i) => i)); return { id: "q" + (++qSeq), type: "mc", prompt, opts: order.map(i => opts[i]), ans: order.indexOf(0) }; }

      ${checked ? "" : `<div class="toks">${q.tokens.map((t, i) => `<button type="button" class="tok${sel.includes(i) ? " used" : ""}" data-q="${q.id}" data-add="${i}">${esc(t)}</button>`).join("")}</div><p class="hint">Tap a word in the top line to remove it.</p>`}`;

function makePractice(lk, ui) {

  if (ph.length) { const s = pick(ph, 1)[0]; qs.push(orderQ(s.replace(/[.!?,]/g, "").split(" "), [s], "Build the sentence: tap the words in the right order.")); }
  const used = new Set(qs.map(q => q.prompt));
  pick(vs.filter(v => !used.has(`What does “${v.w}” mean?`)), 10 - qs.length).forEach(v => {
    const wrong = pick(vs.filter(x => x.w !== v.w && x.en !== v.en), 2).map(x => x.w);

}

function buildExam(lk) {
  const X = EXAMS[lk], vocab = levelVocab(lk);
  const nouns = vocab.filter(v => isNoun(v) && !v.w.includes("/") && v.pl !== "(Pl.)");
  const listen = [];
  pick(vocab.filter(spellable), X.words).forEach(v => listen.push(listenWordQ(v)));
  pick(NAMES, X.names).forEach(n => listen.push(textQ("Listen: a name is spelled letter by letter. Write the name.", [n], { spell: n, show: n })));
  if (X.sentences) {
    const sents = LEVELS[lk].units.flatMap(u => u.p.map(p => p[0])).filter(s => !/[…\/]/.test(s) && s.split(" ").length <= 9);
    pick(sents, X.sentences).forEach(s => listen.push(textQ("Listen and write the whole sentence.", [s], { say: s, mode: "sentence", show: s })));
  }
  const write = [...pick(nouns, 6).map(v => translateQ(v, vocab)), ...X.order.map(([t, a]) => orderQ(t, a))];
  return {
    lk, idx: -1, ans: {}, done: false, checked: {},
    secs: [
      { name: "Lesen", en: "Read", todo: "Read the text carefully. Then choose the right answer for each question.", text: X.read, qs: X.readQ.map(([q, o]) => mcQ(q, o)) },
      { name: "Lücken", en: "Fill in the blanks", todo: "Choose or type the word that fits the gap (___). The word in brackets tells you which verb or form to use.", qs: [...X.fillMc.map(([q, o]) => mcQ(q, o)), ...X.fillType.map(([q, a]) => textQ(q, a))] },
      { name: "Hören & Buchstabieren", en: "Listen and spell", todo: "Press Play, listen, and type what you hear. You can play it as often as you want. Use the ä ö ü ß buttons if your keyboard doesn't have them.", qs: listen },
      { name: "Schreiben", en: "Write", todo: "Write the German word with der, die or das. Then build sentences by tapping the words in the right order.", qs: write },
    ],
  };
}
function examHTML() {
  const E = EXAM, L = LEVELS[E.lk];
  if (E.idx === -1) {
    const tot = E.secs.reduce((s, x) => s + x.qs.length, 0);
    return `<button class="back" type="button" data-level="${E.lk}">← ${L.name} lessons</button>
      <div class="title"><span class="eyebrow">Level exam</span><h1>${L.name} exam</h1></div>
      <div class="todo"><b>How it works</b><p>There are 4 parts and ${tot} questions. Answer a part, then press <b>Check this part</b> to see your score for it. To pass${L.next ? " and unlock " + LEVELS[L.next].name : ""}, you need <b>${PASS_MARK}% in every part</b>, so you must do well in reading, gaps, listening and writing. You can take it as often as you like; the questions change each time.</p></div>
      <div class="parts">${E.secs.map((s, i) => `<div><b>Part ${i + 1}: ${esc(s.name)}</b><span>${esc(s.en)} · ${s.qs.length} questions · need ${secNeed(s)}</span></div>`).join("")}</div>
      <div class="row"><button class="btn big" type="button" data-exnext="0">Start part 1 →</button></div>
      <p class="hint">Turn your sound on for part 3.</p>`;
  }
  if (E.done) return examResultHTML();
  const s = E.secs[E.idx], start = E.secs.slice(0, E.idx).reduce((a, x) => a + x.qs.length, 0);
  const last = E.idx === E.secs.length - 1, checked = !!E.checked[E.idx];
  const sOk = secRight(s), sPass = sOk >= secNeed(s);
  return `<div class="spread"><span class="eyebrow">${L.name} exam · Part ${E.idx + 1} of 4</span><button class="back" type="button" data-quit="1">Leave exam</button></div>
    <div class="stepper" style="grid-template-columns:repeat(4,minmax(0,1fr))">${E.secs.map((x, i) => `<span class="step${i === E.idx ? " on" : i < E.idx ? " past" : ""}"><i></i><span>${i + 1}. ${esc(x.en)}</span></span>`).join("")}</div>
    <div class="title"><h1>${esc(s.name)}</h1></div>
    <div class="todo"><b>What to do</b><p>${esc(s.todo)} You need <b>${secNeed(s)} of ${s.qs.length}</b> right in this part.</p></div>
    ${s.text ? `<div class="readtext">${esc(s.text)}</div>` : ""}
    <div class="qlist">${s.qs.map((q, i) => qHTML(q, start + i + 1, E.ans[q.id], checked)).join("")}</div>
    ${checked
      ? `<div class="checkbar ${sPass ? "right" : "wrong"}"><h3>Part ${E.idx + 1}: ${sOk} / ${s.qs.length} · ${sPass ? "passed ✓" : "not passed ✗"}</h3>
          <p>${sPass ? "Well done. Look at any red answers, then continue." : `You needed ${secNeed(s)}. Look at the red answers to learn from them. Finish the exam to see your full result.`}</p>
          ${last ? `<button class="btn big" type="button" data-exfinish="1">See my exam result</button>` : `<button class="btn big" type="button" data-exnext="${E.idx + 1}">Next part →</button>`}</div>`
      : `<div class="checkbar"><p class="hint">You can't change your answers after you check.</p><button class="btn big" type="button" data-excheck="1">Check this part</button></div>`}`;
}
const secRight = s => s.qs.filter(q => grade(q, EXAM.ans[q.id])).length;
const secNeed = s => Math.ceil(s.qs.length * PASS_MARK / 100);
function examResultHTML() {
  const E = EXAM, L = LEVELS[E.lk];
  const per = E.secs.map(s => ({ s, ok: secRight(s), pass: secRight(s) >= secNeed(s) }));
  const ok = per.reduce((a, x) => a + x.ok, 0), tot = E.secs.reduce((a, x) => a + x.qs.length, 0);
  const pct = Math.round(ok / tot * 100), pass = per.every(x => x.pass), failed = per.filter(x => !x.pass);
  const wrong = E.secs.flatMap(s => s.qs.filter(q => !grade(q, E.ans[q.id])));
  const nextName = L.next ? LEVELS[L.next].name : null;
  return `<div class="score ${pass ? "pass" : "fail"}">
      <span class="eyebrow">${L.name} exam result</span>
      <div class="big">${pct}%</div>
      <h2>${pass ? (nextName ? `Bestanden! You passed every part. ${nextName} is now open.` : "Bestanden! You finished the whole course.") : `Not yet. You must pass all 4 parts (${PASS_MARK}% each).`}</h2>
      <p>${ok} of ${tot} answers correct.${pass ? "" : ` Parts to improve: <b>${failed.map(x => esc(x.s.en)).join(", ")}</b>. Review the lessons, then try again. The questions change each time.`}</p>
      <div class="secscore">${per.map(x => `<div><span>${esc(x.s.name)} (${esc(x.s.en)})</span><b class="${x.pass ? "partok" : "partbad"}">${x.ok} / ${x.s.qs.length} ${x.pass ? "✓" : "✗"}</b></div>`).join("")}</div>
      <div class="row">${pass && nextName ? `<button class="btn big" type="button" data-level="${L.next}">Go to ${nextName} →</button>` : ""}
        <button class="btn${pass && nextName ? " ghost" : ""}" type="button" data-exam="${E.lk}">Take the exam again</button>
        <button class="btn ghost" type="button" data-level="${E.lk}">Back to ${L.name} lessons</button></div>
    </div>
    ${wrong.length ? `<div class="title"><h2>Your mistakes (${wrong.length})</h2></div><div class="qlist">${wrong.map((q, i) => qHTML(q, i + 1, E.ans[q.id], true)).join("")}</div>` : ""}`;
}

function pronHTML() {
  return `<button class="back" type="button" data-go="home">← Home</button>
  <div class="title"><span class="eyebrow">Tool</span><h1>Pronunciation lab</h1></div>
  <div class="todo"><b>What to do</b><p>Tap a word to hear it, then repeat it out loud. Record yourself on your phone and compare. Paste any German text into the box to hear it read.</p></div>
  <div class="card"><textarea id="readText" aria-label="German text">Guten Morgen! Ich heiße Lina und komme aus Tunesien. Ich lerne seit drei Monaten Deutsch, weil ich später in Deutschland arbeiten möchte.</textarea>
    <div class="row"><button class="btn" type="button" id="readBtn">${ICON} Read aloud</button><button class="btn ghost" type="button" id="stopBtn">Stop</button>
    <label class="toggle" for="rate">Speed <input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="${rate}"> <output id="rateOut">${rate.toFixed(2)}×</output></label></div></div>
  <div class="grid3">${SOUNDS.map(s => `<div class="card sound"><div class="row"><h3>${esc(s.s)}</h3><span class="ipa">${esc(s.ipa)}</span></div><p>${esc(s.tip)}</p><div class="chips">${s.w.map(w => `<button class="chip" type="button" data-say="${esc(w)}">${ICON}${esc(w)}</button>`).join("")}</div></div>`).join("")}</div>
  <div class="title"><h2>Word pairs that sound almost the same</h2><p class="lede">Listen to both, then say them yourself.</p></div>
  <div class="grid3">${PAIRS.map(([w, a, b]) => `<div class="card"><span class="eyebrow">${esc(w)}</span><div class="chips"><button class="chip" type="button" data-say="${esc(a)}">${ICON}${esc(a)}</button><button class="chip" type="button" data-say="${esc(b)}">${ICON}${esc(b)}</button></div></div>`).join("")}</div>`;
}
function writeHTML() {
  return `<button class="back" type="button" data-go="home">← Home</button>
  <div class="title"><span class="eyebrow">Tool</span><h1>Writing models</h1></div>
  <div class="todo"><b>What to do</b><p>Open a model, read the steps, listen to the text. Then write your own text with the same steps.</p></div>
  <div class="tablewrap"><table><thead><tr><th></th><th>Friends (du)</th><th>Formal (Sie)</th></tr></thead><tbody>
    <tr><td><b>Start</b></td><td>Liebe Anna, / Lieber Tom, / Hallo,</td><td>Sehr geehrte Frau Becker, / Sehr geehrte Damen und Herren,</td></tr>
    <tr><td><b>Next line</b></td><td colspan="2">starts with a small letter: “danke für …”, “ich schreibe Ihnen, weil …”</td></tr>
    <tr><td><b>End</b></td><td>Viele Grüße / Liebe Grüße</td><td>Mit freundlichen Grüßen</td></tr></tbody></table></div>
  <div class="qlist">${MODELS.map(m => `<details class="model"><summary>${m.lvl} · ${esc(m.t)}</summary><div class="mb"><ol class="clean">${m.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol><div class="letter">${esc(m.text)}</div><div><button class="btn ghost" type="button" data-say="${esc(m.text)}">${ICON} Listen</button></div></div></details>`).join("")}</div>`;
}
function resHTML() {
  return `<button class="back" type="button" data-go="home">← Home</button>
  <div class="title"><span class="eyebrow">Tool</span><h1>Free resources</h1></div>
  <div class="todo"><b>What to do</b><p>Don't use everything. Pick one main course (Nicos Weg or VHS-Lernportal) and one listening source for your level.</p></div>
  ${RES.map(([g, list]) => `<div class="title"><h2>${esc(g)}</h2></div><div class="grid3">${list.map(([n, u, l, d]) => `<div class="card res"><div class="spread"><h3><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a></h3><span class="lv">${esc(l)}</span></div><p>${esc(d)}</p></div>`).join("")}</div>`).join("")}`;
}

function render() {
  let h;
  if (V.name === "level") h = unlocked(V.lk) ? levelHTML(V.lk) : homeHTML();
  else if (V.name === "lesson") h = lessonHTML();
  else if (V.name === "exam" && EXAM) h = examHTML();
  else if (V.name === "aussprache") h = pronHTML();
  else if (V.name === "schreiben") h = writeHTML();
  else if (V.name === "ressourcen") h = resHTML();
  else h = homeHTML();
  view.innerHTML = h;
  stats();
  if (V.name === "aussprache") {
    const r = document.getElementById("rate"), o = document.getElementById("rateOut");
    r.addEventListener("input", () => { rate = parseFloat(r.value); o.textContent = rate.toFixed(2) + "×"; });
    document.getElementById("readBtn").addEventListener("click", e => speak(document.getElementById("readText").value, e.currentTarget));
    document.getElementById("stopBtn").addEventListener("click", () => synth && synth.cancel());
  }
}
function curQs() { return V.name === "exam" && EXAM ? (EXAM.secs[EXAM.idx] || {}).qs || [] : PR ? PR.qs : []; }
function curAns() { return V.name === "exam" && EXAM ? EXAM.ans : PR ? PR.ans : {}; }
function refreshQ(qid) {
  const q = curQs().find(x => x.id === qid), box = document.getElementById("box-" + qid);
  if (q && box) box.outerHTML = qHTML(q, box.dataset.n, curAns()[qid], false);
}

let lastInput = null;
document.addEventListener("focusin", e => { if (e.target.matches("input[type=text], textarea")) lastInput = e.target; });
document.addEventListener("mousedown", e => { if (e.target.closest(".key")) e.preventDefault(); });
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.say !== undefined) { speak(d.say, t.classList.contains("say") ? t : null, d.rate ? parseFloat(d.rate) : undefined); return; }
  if (d.key) {
    const box = t.closest(".q"), el = box ? box.querySelector("input[type=text]") : lastInput;
    if (!el || el.disabled) return;
    const s = el.selectionStart ?? el.value.length, en = el.selectionEnd ?? s;
    el.value = el.value.slice(0, s) + d.key + el.value.slice(en); el.focus(); el.setSelectionRange(s + 1, s + 1);
    el.dispatchEvent(new Event("input", { bubbles: true })); return;
  }
  if (d.hint) { const h = document.getElementById("hint-" + d.hint); if (h) h.hidden = false; t.hidden = true; return; }
  if (d.go) { if (d.go === "home") EXAM = null; go({ name: d.go }); return; }
  if (d.level) { EXAM = null; go({ name: "level", lk: d.level }); return; }
  if (d.lesson) { const [lk, ui] = d.lesson.split(":"); if (!lessonOpen(lk, +ui)) return; PR = null; go({ name: "lesson", lk, ui: +ui, step: 0 }); return; }
  if (d.step !== undefined && V.name === "lesson") { go(Object.assign({}, V, { step: +d.step })); return; }
  if (d.qcheck) {
    const q = PR.qs[PR.i], a = PR.ans[q.id];
    if (empty(a)) { const w = document.getElementById("qwarn"); if (w) { w.textContent = "Choose or type an answer first."; w.classList.add("warn"); } return; }
    PR.res[q.id] = grade(q, a); PR.phase = "fb"; render();
    if (PR.res[q.id] && q.say) speak(q.say);
    const cb = document.querySelector(".checkbar .btn"); if (cb) cb.focus({ preventScroll: true });
    return;
  }
  if (d.qnext) {
    if (PR.i + 1 < PR.qs.length) { PR.i++; PR.phase = "q"; render(); window.scrollTo({ top: 0 }); return; }
    PR.phase = "end";
    const id = V.lk + "-" + (V.ui + 1), right = quizRight();
    if (right >= quizNeed()) { const pct = Math.round(right / PR.qs.length * 100); P.done[id] = Math.max(typeof P.done[id] === "number" ? P.done[id] : 0, pct); award(right * 2 + 10); }
    else award(right);
    save(); render(); window.scrollTo({ top: 0 }); return;
  }
  if (d.newquiz) { PR = null; render(); window.scrollTo({ top: 0 }); return; }
  if (d.exam) { if (!examOpen(d.exam)) return; EXAM = buildExam(d.exam); go({ name: "exam" }); return; }
  if (d.exnext !== undefined) { EXAM.idx = +d.exnext; render(); window.scrollTo({ top: 0 }); return; }
  if (d.excheck) {
    const s = EXAM.secs[EXAM.idx], n = s.qs.filter(q => empty(EXAM.ans[q.id])).length;
    if (n && !d.sure) { t.dataset.sure = "1"; t.textContent = `${n} questions are empty. Tap again to check anyway`; return; }
    EXAM.checked[EXAM.idx] = true; render();
    const cb = document.querySelector(".checkbar"); if (cb) cb.scrollIntoView({ block: "center" });
    return;
  }
  if (d.exfinish) {
    EXAM.done = true;
    const tot = EXAM.secs.reduce((a, x) => a + x.qs.length, 0), ok = EXAM.secs.reduce((a, s) => a + secRight(s), 0);
    const pct = Math.round(ok / tot * 100), prev = P.exams[EXAM.lk] || {}, pass = EXAM.secs.every(s => secRight(s) >= secNeed(s));
    P.exams[EXAM.lk] = { best: Math.max(prev.best || 0, pct), passed: !!prev.passed || pass, last: pct };
    award(ok * 2 + (pass ? 50 : 0));
    save(); render(); window.scrollTo({ top: 0 }); return;
  }
  if (d.quit) { if (!d.sure) { t.dataset.sure = "1"; t.textContent = "Tap again to leave (your answers will be lost)"; return; } const lk = EXAM.lk; EXAM = null; go({ name: "level", lk }); return; }
  if (d.q) {
    const ans = curAns();
    if (d.i !== undefined) ans[d.q] = +d.i;
    else if (d.add !== undefined) { const a = Array.isArray(ans[d.q]) ? ans[d.q] : []; if (!a.includes(+d.add)) a.push(+d.add); ans[d.q] = a; }
    else if (d.rm !== undefined) { const a = Array.isArray(ans[d.q]) ? ans[d.q] : []; a.splice(+d.rm, 1); ans[d.q] = a; }
    refreshQ(d.q);
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.q) { curAns()[el.dataset.q] = el.value; return; }
  if (el.dataset.draft) {
    try { localStorage.setItem("dw-draft-" + el.dataset.draft, el.value); } catch (err) {}
    const wc = document.getElementById("wc"); if (wc) wc.textContent = (el.value.trim() ? el.value.trim().split(/\s+/).length : 0) + " words · saved in this browser";
  }
});
// Enter in a quiz box = press Check / Continue
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || V.name !== "lesson" || !PR || !e.target.matches("input[type=text]")) return;
  const b = document.querySelector("[data-qcheck], [data-qnext]"); if (b) { e.preventDefault(); b.click(); }
});
document.addEventListener("change", e => { if (e.target.id === "hideEn") document.getElementById("wordGrid").classList.toggle("hide-en", e.target.checked); });

const h0 = (location.hash || "").slice(1);
if (["aussprache", "schreiben", "ressourcen"].includes(h0)) V = { name: h0 };
else if (LEVELS[h0]) V = { name: "level", lk: h0 };
render();
</script>

</body>
</html>
